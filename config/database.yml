default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  port: 5432
  username: postgres
  password: <%= ENV["COWORK_HUB_DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: cowork_hub_development

test:
  <<: *default
  database: cowork_hub_test

production:
  primary: &primary_production
    <<: *default
    database: cowork_hub_production
    username: cowork_hub
    password: <%= ENV["COWORK_HUB_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: cowork_hub_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: cowork_hub_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: cowork_hub_production_cable
    migrations_paths: db/cable_migrate